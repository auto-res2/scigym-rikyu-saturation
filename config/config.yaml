mode: full
results_dir: .research/results

data_root: /data1/rkp00041/scigym_improvement/data/scigym_sbml  # small / large の親。run の yaml の split で選ぶ
base_url: https://api.rikyu.r-ccs.riken.jp/v1
max_iterations: 100
eval_debug_rounds: 3
temperature: 1.0
max_tokens: 32768
workers: 48  # API はバッチ処理で 1 要求あたりの速度が落ちないので、100 反復を 4 日に収めるために上げる
instance_timeout: 129600  # 1 件 1 試行の上限秒（36 時間）。100 反復は 20 反復の 5 倍かかる
